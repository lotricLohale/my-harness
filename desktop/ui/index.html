<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Harness</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <p class="eyebrow">TAURI LAUNCHER</p>
    <h1>My Harness</h1>
    <p class="subtitle">原样运行 DeepSeek Harness，通过外部插件接入 Antigravity。</p>
    <section class="status-card">
      <span id="dot" class="dot"></span>
      <div>
        <strong id="status">正在启动 Harness…</strong>
        <small id="url"></small>
      </div>
    </section>
    <div class="actions">
      <button id="open" disabled>打开 Harness</button>
      <button id="check" class="secondary">检查核心更新</button>
    </div>
    <pre id="message"></pre>
  </main>
  <script src="app.js"></script>
</body>
</html>
